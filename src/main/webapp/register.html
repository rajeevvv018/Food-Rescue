<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — FoodRescue</title>
  <meta name="description"
    content="Create your FoodRescue account as a Provider, NGO, or Volunteer and start making a difference today.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/forms.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍱</text></svg>">
</head>

<body>

  <div class="auth-page">
    <!-- Left Branding Panel -->
    <div class="auth-branding">
      <div class="auth-branding__logo">🍱 FoodRescue</div>
      <h2 class="auth-branding__title">Join the Mission</h2>
      <p class="auth-branding__desc">
        Be part of a growing community rescuing surplus food and supporting people in need.
      </p>
      <div class="auth-branding__stats">
        <div class="auth-branding__stat">
          <div class="auth-branding__stat-value">12K+</div>
          <div class="auth-branding__stat-label">Meals Rescued</div>
        </div>
        <div class="auth-branding__stat">
          <div class="auth-branding__stat-value">120+</div>
          <div class="auth-branding__stat-label">Providers</div>
        </div>
        <div class="auth-branding__stat">
          <div class="auth-branding__stat-value">48+</div>
          <div class="auth-branding__stat-label">NGO Partners</div>
        </div>
      </div>
    </div>

    <!-- Form Panel -->
    <div class="auth-form-panel">
      <div class="auth-form-container">
        <div class="auth-form__header">
          <a href="index.html"
            style="display:inline-flex;align-items:center;gap:0.5rem;font-size:0.875rem;color:var(--color-text-muted);margin-bottom:1.5rem;">
            ← Back to Home
          </a>
          <h1 class="auth-form__title">Create Account</h1>
          <p class="auth-form__subtitle">
            Already have an account? <a href="login.html">Sign in</a>
          </p>
        </div>

        <!-- Alert placeholder -->
        <div id="register-alert" class="auth-alert auth-alert--error hidden">
          <span>⚠️</span>
          <span id="register-alert-text">Something went wrong.</span>
        </div>

        <form class="auth-form" id="register-form" action="register" method="POST">
          <div class="form-group">
            <label for="reg-name" class="form-label">Full Name</label>
            <input type="text" id="reg-name" name="name" class="form-input" placeholder="Enter your full name" required>
          </div>

          <div class="form-group">
            <label for="reg-email" class="form-label">Email Address</label>
            <input type="email" id="reg-email" name="email" class="form-input" placeholder="you@example.com" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="reg-password" class="form-label">Password</label>
              <div class="password-wrapper">
                <input type="password" id="reg-password" name="password" class="form-input"
                  placeholder="Min 8 characters" required minlength="8">
                <button type="button" class="password-toggle"
                  aria-label="Toggle password visibility">👁</button>
              </div>
            </div>
            <div class="form-group">
              <label for="reg-phone" class="form-label">Phone Number</label>
              <input type="tel" id="reg-phone" name="phone" class="form-input" placeholder="+91 XXXXXXXXXX" required>
            </div>
          </div>

          <div class="form-group">
            <label for="reg-role" class="form-label">I am a</label>
            <select id="reg-role" name="role" class="form-select" required>
              <option value="" disabled selected>Select your role</option>
              <option value="PROVIDER">Food Provider</option>
              <option value="NGO">NGO / Organization</option>
              <option value="VOLUNTEER">Volunteer</option>
            </select>
          </div>

          <div class="form-group">
            <label for="reg-address" class="form-label">Address</label>
            <input type="text" id="reg-address" name="address" class="form-input"
              placeholder="Your city or full address" required>
          </div>

          <div class="form-check" style="margin-top: 1rem; margin-bottom: 1.5rem;">
            <input type="checkbox" id="terms" name="terms" class="form-check-input" required>
            <label for="terms" class="form-check-label">I agree to the <a href="#">Terms of Service</a> and <a
                href="#">Privacy Policy</a></label>
          </div>

          <button type="submit" class="auth-form__submit" id="register-submit">
            Create Account
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="assets/js/auth.js"></script>
  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
